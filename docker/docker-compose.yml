version: "3.9"

services:
  ui:
    container_name: wsc-ui
#    image: "${WSC_DOCKER_IMAGE}:${WSC_DOCKER_TAG}"
    image: wsc-frontend:latest
    ports:
      - 3000:3000
  wsc:
    container_name: wsc
    image: "${WSC_DOCKER_IMAGE}:${WSC_DOCKER_TAG}"
    command:
      - "manage"
      - "08a8d0bb8717839931b0a594f7c28b0a3b7c78f6e9172e977e250eab7637d879.0"
      - "start"
    ports:
      - "${WSC_PORT}:${WSC_CONTAINER_PORT}"
    environment:
      WST_BLOCKFROST_TOKEN: "${WST_BLOCKFROST_TOKEN}"
